name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet buildozer cython

      - name: Prepare buildozer
        run: |
          buildozer init
          sed -i 's/package\.name = myapp/package.name = flet_app/g' buildozer.spec
          sed -i 's/package\.domain = org\.test/package.domain = org.fletapp/g' buildozer.spec
          sed -i 's/source\.dir = .*/source.dir = ./' buildozer.spec
          sed -i 's/source\.include_exts = py, png, jpg, kv, atlas/source.include_exts = py, png, jpg, kv, atlas, json/' buildozer.spec
          sed -i 's/requirements = python3/requirements = python3,flet/' buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug
          mkdir -p output
          cp bin/*.apk output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: output/*.apk
